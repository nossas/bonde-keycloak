name: Build Java Provider Keycloak

on:
    push:
      branches: [ main, feature/** ]
      paths:
        - 'keycloak-bonde/**'
    pull_request:
        branches: [ main, feature/** ]
    workflow_dispatch: # Permite execução manual
    workflow_call: # Permite ser chamado por outro workflow
    outputs:
        plugin-version:
        description: "Version of the built plugin"
        value: ${{ jobs.build.outputs.plugin-version }}

jobs:
    build:
        runs-on: ubuntu-latest
    
        steps:
        # 1. Checkout the source code
        - uses: actions/checkout@v4

        # 2. Set up the Java environment (JDK 17)
        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: 'maven'

        - name: Get plugin version
          id: get-version
          run: |
            VERSION=$(grep -m1 '<version>' keycloak-bonde/pom.xml | sed -E 's/.*<version>(.*)<\/version>.*/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Plugin version: $VERSION"

        # 3. Build and package the project
        - name: Build with Maven
          run: mvn clean package -B -DskipTests
          working-directory: ./keycloak-bonde
        
        - name: Upload Plugin JAR as Artifact
          uses: actions/upload-artifact@v4
          with:
            name: keycloak-bonde-plugin
            path: keycloak-bonde/plugin/target/*.jar
            retention-days: 30
            if-no-files-found: error
        
        - name: Upload to workflow artifacts (for sharing)
          uses: actions/upload-artifact@v4
          with:
            name: providers
            path: keycloak-bonde/plugin/target/*.jar
            retention-days: 7