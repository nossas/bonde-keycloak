name: Build and Deploy Keycloak

on:
  push:
    branches: [ main, feature/** ]
    paths:
      - 'keycloak-bonde/**'
      - 'themes/**'
      - 'Dockerfile'
  pull_request:
    branches: [ main, feature/** ]
  workflow_dispatch:

jobs:
  build-provider:
    runs-on: ubuntu-latest
    outputs:
      plugin-version: ${{ steps.get-version.outputs.version }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Get plugin version
      id: get-version
      run: |
        VERSION=$(grep -m1 '<version>' keycloak-bonde/pom.xml | sed -E 's/.*<version>(.*)<\/version>.*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Plugin version: $VERSION"

    - name: Build with Maven
      run: mvn clean package -B -DskipTests
      working-directory: ./keycloak-bonde
    
    - name: Upload Plugin JAR as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keycloak-bonde-plugin
        path: keycloak-bonde/plugin/target/*.jar
        retention-days: 30
        if-no-files-found: error

  build-and-deploy:
    needs: build-provider
    runs-on: ubuntu-latest
    if: always()  # Roda mesmo se o build falhar (para debugging)
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download plugin artifact
      uses: actions/download-artifact@v4
      with:
        name: keycloak-bonde-plugin
        path: ./providers

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: nossas/bonde-keycloak
        tags: |
          type=raw,value=latest
          type=sha,prefix={{date 'YYYYMMDD'}}-
          type=raw,value={{date 'YYYYMMDD'}}-{{sha}}
          type=raw,value=${{ needs.build-provider.outputs.plugin-version }}

    - name: List providers directory (debug)
      run: |
        echo "Providers directory contents:"
        ls -la providers/ || echo "No providers directory"

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./
        file: Dockerfile
        # push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          PLUGIN_VERSION=${{ needs.build-provider.outputs.plugin-version }}